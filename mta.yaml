_schema-version: '3.1'
ID: itc-dealer-portal
version: 1.0.0
description: Dealer Portal backend

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # CAP backend
  - name: itc-dealer-portal
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: itc-xsua-srv
      # - name: mail-destination
      - name: itc-hdi-shared-srv
      # - name: itc-scheduler

  # DB deployer (creates tables and loads CSV data in HANA)
  - name: itc-dealer-portal-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      no-route: true
      no-start: true
      tasks:
        - name: hdi-deploy
          command: npm start
    requires:
      - name: itc-hdi-shared-srv

resources:
  - name: itc-xsua-srv
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: itc-dealer-portal
        tenant-mode: dedicated

  # - name: mail-destination
  #   type: org.cloudfoundry.managed-service
  #   parameters:
  #     service: destination
  #     service-plan: lite

  - name: itc-hdi-shared-srv
    type: org.cloudfoundry.existing-service
      
  # - name: itc-scheduler
  #   type: org.cloudfoundry.existing-service